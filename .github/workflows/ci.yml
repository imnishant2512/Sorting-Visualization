name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A second push to the same branch cancels the run still in flight for it —
# only the tip of a branch is worth spending minutes on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # `npm run build` is `tsc -b && vite build`, so this is the typecheck as
      # well as the bundle. It runs last: a type error is easier to read than a
      # test failure caused by one.
      - name: Typecheck and build
        run: npm run build
